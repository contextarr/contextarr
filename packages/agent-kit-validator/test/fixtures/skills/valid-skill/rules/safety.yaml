disallowed:
  executable_files: true
  shell_commands: true
  network_calls: true
  credential_requests: true
  browser_automation: true
  hidden_prompts: true
  tool_execution: true
patterns:
  - name: credential_request
    regex: "(api key|password|token)"
    severity: high
    action: review
  - name: hidden_prompt
    regex: "(ignore previous instructions|do not tell the user)"
    severity: high
    action: review
