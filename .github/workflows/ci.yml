name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  credibility-gates:
    name: Credibility Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whitespace in changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="HEAD~1"
            fi
            git diff --check "$base..HEAD"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify docs
        run: pnpm docs:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Validate demo packs
        run: pnpm demo:validate

      - name: Build web dashboard
        run: pnpm --filter @contextarr/web build

      - name: Verify public site
        run: pnpm site:verify

      - name: Run server tests
        run: pnpm --filter @contextarr/server test

      - name: Run CLI tests
        run: pnpm --filter @contextarr/cli test

      - name: Run MCP tests
        run: pnpm --filter @contextarr/mcp test

      - name: Docker smoke
        run: pnpm docker:verify

      - name: Run security gate
        run: pnpm security:verify

      - name: Verify release docs
        run: node tools/launch/verify-release-docs.mjs
