schemaVersion: contextarr.benchmark-task.v1
id: ai-workstation-troubleshooting
name: AI Workstation Troubleshooting
taskType: technical_troubleshooting
packIds:
  - ai-workstation-pack
exportProfileIds:
  - ai-workstation-codex
  - ai-workstation-chatgpt
conditions:
  - no_context
  - manual_prompt
  - raw_notes
  - contextarr_export
futureConditions:
  - contextarr_cli_brief
  - contextarr_mcp_query
prompt: |
  A fictional local AI workstation demo has a service that works on the machine but should not be exposed accidentally. Write a concise troubleshooting answer that identifies the likely layer, safe checks, and next action.
targetAudience: technical_operator
expectedOutput:
  format: markdown
  requiredSections:
    - diagnosis
    - safe_checks
    - next_action
    - safety_notes
blockedBehavior:
  - external_network_calls
  - shell_execution
  - private_data_disclosure
  - real_hostnames_or_addresses
  - unreviewed_content_use
