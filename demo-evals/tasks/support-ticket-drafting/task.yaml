schemaVersion: contextarr.benchmark-task.v1
id: support-ticket-drafting
name: Support Ticket Drafting
taskType: support_ticket_drafting
packIds:
  - internal-support-kb-pack
exportProfileIds:
  - internal-support-chatgpt
  - internal-support-codex
conditions:
  - no_context
  - manual_prompt
  - raw_notes
  - contextarr_export
futureConditions:
  - contextarr_cli_brief
  - contextarr_mcp_query
prompt: |
  Draft a customer-safe reply for a fictional support ticket. The customer reports a report delay and asks what to do next. Keep the response concise, safe, and free of internal-only routing labels.
targetAudience: support_agent
expectedOutput:
  format: markdown
  requiredSections:
    - customer_reply
    - internal_notes_not_for_customer
    - follow_up
blockedBehavior:
  - private_data_disclosure
  - internal_label_disclosure
  - unsupported_status_claims
  - external_network_calls
  - shell_execution
