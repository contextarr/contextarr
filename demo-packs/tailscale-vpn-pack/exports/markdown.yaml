id: tailscale-vpn-markdown
name: Tailscale VPN Pack Generic Markdown Export
target: generic_markdown
format: markdown
privacy_mode: redacted
include:
  records:
    - tailscale-vpn-pack.tailnet-overview
    - tailscale-vpn-pack.device-inventory
    - tailscale-vpn-pack.access-controls
    - tailscale-vpn-pack.subnet-routes
    - tailscale-vpn-pack.exit-node-policy
    - tailscale-vpn-pack.sharing-rules
    - tailscale-vpn-pack.troubleshooting
    - tailscale-vpn-pack.review-cadence
exclude_tags:
  - secret
  - never_export
  - imported_draft
token_budget: 12000
sections:
  - summary
  - key_facts
  - constraints
  - sources
