id: ai-workstation-codex
name: AI Workstation Codex Export
target: codex
format: markdown
privacy_mode: redacted
include:
  records:
    - ai-workstation.hardware-overview
    - ai-workstation.local-ai-stack
    - ai-workstation.storage-layout
    - ai-workstation.networking-notes
    - ai-workstation.troubleshooting-workflow
    - ai-workstation.capacity-planning
    - ai-workstation.maintenance-cadence
    - ai-workstation.safety-boundaries
exclude_tags:
  - secret
  - never_export
  - imported_draft
token_budget: 10000
sections:
  - summary
  - constraints
  - do_not_assume
  - sources
