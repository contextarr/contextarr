id: jellyfin-server-json-records
name: Jellyfin Server JSON Records Export
target: json_records
format: json
privacy_mode: redacted
include:
  records:
    - jellyfin-server.media-library-layout
    - jellyfin-server.container-setup
    - jellyfin-server.user-roles
    - jellyfin-server.backup-routine
    - jellyfin-server.playback-troubleshooting
exclude_tags:
  - secret
  - never_export
token_budget: 24000
sections:
  - records
  - sources
