id: jellyfin-server-markdown
name: Jellyfin Server Generic Markdown Export
target: generic_markdown
format: markdown
privacy_mode: redacted
include:
  records:
    - jellyfin-server.media-library-layout
    - jellyfin-server.container-setup
    - jellyfin-server.user-roles
    - jellyfin-server.backup-routine
    - jellyfin-server.playback-troubleshooting
exclude_tags:
  - secret
  - never_export
token_budget: 18000
sections:
  - summary
  - records
  - sources
