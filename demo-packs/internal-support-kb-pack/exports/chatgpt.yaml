id: internal-support-chatgpt
name: Internal Support KB ChatGPT Export
target: chatgpt
format: markdown
privacy_mode: redacted
include:
  records:
    - internal-support.ticket-intake
    - internal-support.escalation-policy
    - internal-support.customer-safe-response-rules
    - internal-support.known-issues
    - internal-support.review-workflow
exclude_tags:
  - secret
  - never_export
token_budget: 12000
sections:
  - summary
  - support_rules
  - known_issues
  - sources
