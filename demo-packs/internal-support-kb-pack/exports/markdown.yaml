id: internal-support-markdown
name: Internal Support KB Generic Markdown Export
target: generic_markdown
format: markdown
privacy_mode: redacted
include:
  records:
    - internal-support.ticket-intake
    - internal-support.escalation-policy
    - internal-support.customer-safe-response-rules
    - internal-support.known-issues
    - internal-support.review-workflow
    - internal-support.article-taxonomy
    - internal-support.macro-library
    - internal-support.quality-review-rubric
exclude_tags:
  - secret
  - never_export
  - imported_draft
token_budget: 18000
sections:
  - summary
  - records
  - sources
