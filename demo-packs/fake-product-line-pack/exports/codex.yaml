id: fake-product-line-codex
name: Product Line Codex Export
target: codex
format: markdown
privacy_mode: redacted
include:
  records:
    - fake-product-line.product-overview
    - fake-product-line.model-comparison
    - fake-product-line.support-matrix
    - fake-product-line.release-notes
    - fake-product-line.sales-support-faq
    - fake-product-line.buyer-guide
    - fake-product-line.compatibility-requirements
    - fake-product-line.packaging-tiers
exclude_tags:
  - secret
  - never_export
  - imported_draft
token_budget: 10000
sections:
  - summary
  - constraints
  - reference_tables
  - sources
