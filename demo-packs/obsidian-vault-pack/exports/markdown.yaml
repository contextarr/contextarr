id: obsidian-vault-markdown
name: Obsidian Vault Pack Generic Markdown Export
target: generic_markdown
format: markdown
privacy_mode: redacted
include:
  records:
    - obsidian-vault-pack.vault-overview
    - obsidian-vault-pack.folder-map
    - obsidian-vault-pack.note-conventions
    - obsidian-vault-pack.frontmatter-rules
    - obsidian-vault-pack.linking-patterns
    - obsidian-vault-pack.daily-notes
    - obsidian-vault-pack.import-boundaries
    - obsidian-vault-pack.export-rules
exclude_tags:
  - secret
  - never_export
  - imported_draft
token_budget: 12000
sections:
  - summary
  - key_facts
  - constraints
  - sources
