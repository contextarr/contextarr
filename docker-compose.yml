name: contextarr

services:
  app:
    build:
      context: .
      args:
        VITE_CONTEXTARR_API_TOKEN: ${CONTEXTARR_DOCKER_API_TOKEN:-contextarr-local-preview-token}
    image: contextarr:local-preview
    ports:
      - "127.0.0.1:${CONTEXTARR_DOCKER_PORT:-3210}:3210"
    environment:
      CONTEXTARR_HOST: 0.0.0.0
      CONTEXTARR_PORT: 3210
      CONTEXTARR_PACKS_DIR: /app/demo-packs
      CONTEXTARR_SKILLS_DIR: /app/demo-skills
      CONTEXTARR_DEMO_AGENT_KITS_DIR: /app/demo-agent-kits
      CONTEXTARR_AGENT_KITS_DIR: /app/agent-kits
      CONTEXTARR_COMPOSED_PACKS_DIR: /app/composed-packs
      CONTEXTARR_DATABASE_PATH: /app/data/contextarr.db
      CONTEXTARR_WEB_DIST_DIR: /app/apps/web/dist
      CONTEXTARR_API_TOKEN: ${CONTEXTARR_DOCKER_API_TOKEN:-contextarr-local-preview-token}
    volumes:
      - ./demo-packs:/app/demo-packs:ro
      - ./demo-skills:/app/demo-skills:ro
      - ./demo-agent-kits:/app/demo-agent-kits:ro
      - ./agent-kits:/app/agent-kits
      - ./composed-packs:/app/composed-packs
      - contextarr-data:/app/data
    restart: unless-stopped

volumes:
  contextarr-data:
