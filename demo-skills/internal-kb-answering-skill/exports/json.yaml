id: internal-kb-answering-skill-json
name: Internal KB Answering Skill JSON Export
target: json
format: json
privacy_mode: redacted
include:
  instructions:
    - internal-kb-answering-skill.answer-shape
    - internal-kb-answering-skill.citation-discipline
